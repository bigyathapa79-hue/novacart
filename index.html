<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#2563eb" />

    <!-- Primary SEO -->
    <title>NovaCart | Shop Smart. Live Better.</title>

    <meta
      name="description"
      content="Shop premium electronics, fashion, furniture, gadgets, and lifestyle products at affordable prices with NovaCart."
    />

    <meta
      name="keywords"
      content="NovaCart, online shopping, ecommerce, electronics, fashion, furniture, gadgets, lifestyle products"
    />

    <meta name="author" content="NovaCart" />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://novacart.com/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/x-icon"
      href="/images/logo/favicon.ico"
    />

    <!-- Apple Touch Icon -->
    <link
      rel="apple-touch-icon"
      href="/images/logo/apple-touch-icon.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="NovaCart | Shop Smart. Live Better."
    />

    <meta
      property="og:description"
      content="Discover premium electronics, fashion, furniture, gadgets, and lifestyle products at affordable prices."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://novacart.com/"
    />

    <meta
      property="og:site_name"
      content="NovaCart"
    />

    <meta
      property="og:image"
      content="https://novacart.com/images/seo/cover.png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="NovaCart | Shop Smart. Live Better."
    />

    <meta
      name="twitter:description"
      content="Discover premium products at affordable prices with NovaCart."
    />

    <meta
      name="twitter:image"
      content="https://novacart.com/images/seo/cover.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
